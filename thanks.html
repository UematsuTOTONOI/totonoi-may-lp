<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>予約リクエスト送信完了｜TOTONOI富士山中湖</title>
  <meta name="description" content="TOTONOI富士山中湖 5月限定直前割の予約リクエスト送信完了ページです。" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&family=Noto+Serif+JP:wght@500;700;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />

  <style>
    .thanks-page {
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(11, 25, 19, 0.78), rgba(11, 25, 19, 0.88)),
        url("images/hero-night-fuji-dome.webp") center center / cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      color: #fff;
    }

    .thanks-card {
      width: min(760px, 100%);
      background: rgba(255, 255, 255, 0.96);
      color: var(--green);
      border-radius: 30px;
      padding: 48px 38px;
      text-align: center;
      box-shadow: 0 24px 70px rgba(0,0,0,0.24);
    }

    .thanks-logo {
      margin-bottom: 26px;
      line-height: 1;
    }

    .thanks-logo .brand-village {
      color: var(--green);
      display: block;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .thanks-logo .brand-main {
      color: var(--green);
      display: block;
      font-size: 36px;
      font-weight: 400;
      letter-spacing: 0.18em;
    }

    .thanks-logo .brand-sub {
      color: var(--green);
      display: block;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.1em;
      margin-top: 8px;
    }

    .thanks-badge {
      display: inline-block;
      background: linear-gradient(135deg, #d1ad68, #9f7a38);
      color: #fff;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.08em;
      margin-bottom: 20px;
    }

    .thanks-card h1 {
      margin: 0;
      font-family: "Noto Serif JP", serif;
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.45;
      color: var(--green);
    }

    .thanks-card p {
      margin: 20px 0 0;
      color: var(--muted);
      line-height: 1.9;
    }

    .thanks-note {
      margin-top: 28px;
      padding: 20px;
      background: #f7f2e9;
      border-radius: 18px;
      text-align: left;
      font-size: 14px;
      color: var(--text);
    }

    .thanks-actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    .thanks-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 0 26px;
      border-radius: 999px;
      font-weight: 900;
      text-decoration: none;
    }

    .thanks-btn-primary {
      background: linear-gradient(135deg, #d1ad68, #9f7a38);
      color: #fff;
      box-shadow: 0 14px 30px rgba(169, 130, 65, 0.25);
    }

    .thanks-btn-secondary {
      background: var(--green);
      color: #fff;
    }

    @media (max-width: 768px) {
      .thanks-page {
        padding: 52px 14px;
      }

      .thanks-card {
        padding: 34px 22px;
        border-radius: 26px;
      }

      .thanks-logo .brand-main {
        font-size: 30px;
      }

      .thanks-actions {
        flex-direction: column;
      }

      .thanks-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="thanks-page">
    <section class="thanks-card">

      <div class="thanks-logo">
        <span class="brand-village">Glamping Village</span>
        <span class="brand-main">TOTONOI</span>
        <span class="brand-sub">Fujiyamanakako</span>
      </div>

      <div class="thanks-badge">REQUEST COMPLETED</div>

      <h1>予約リクエストを<br />受け付けました</h1>

      <p>
        ご入力いただいた内容をスタッフが確認し、<br />
        空室状況を確認のうえ、順次ご連絡いたします。
      </p>

      <div class="thanks-note">
        <strong>ご確認ください</strong><br />
        ・この時点では、まだ予約確定ではございません。<br />
        ・通常予約も同時に承っているため、空室がある場合のみ正式なご案内・予約確定となります。<br />
        ・空室状況により、ご希望に添えない場合がございます。<br />
        ・スタッフ確認後、順次ご連絡いたします。
      </div>

      <div class="thanks-actions">
        <a class="thanks-btn thanks-btn-primary" href="index.html">
          LPに戻る
        </a>
        <a class="thanks-btn thanks-btn-secondary" href="https://www.yamanashi-sauna-glamping.com/" target="_blank" rel="noopener noreferrer">
          公式サイトを見る
        </a>
      </div>

    </section>
  </main>
</body>
</html>
