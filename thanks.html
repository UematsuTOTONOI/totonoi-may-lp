      font-size: 36px;

      display: block;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.1em;

    }

    .thanks-badge {
      display: inline-block;
      background: linear-gradient(135deg, #d1ad68, #9f7a38);

      padding: 8px 16px;

      font-weight: 900;

      padding: 20px;
      background: #f7f2e9;
      border-radius: 18px;
      text-align: left;
      font-size: 14px;
      color: var(--text);
    }

    .thanks-actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    .thanks-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 0 26px;
      border-radius: 999px;
      font-weight: 900;
      text-decoration: none;

    .thanks-btn-primary {
      background: linear-gradient(135deg, #d1ad68, #9f7a38);

      box-shadow: 0 14px 30px rgba(169, 130, 65, 0.25);
