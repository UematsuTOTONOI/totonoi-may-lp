<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>リクエスト送信完了｜TOTONOI富士山中湖</title>
  <style>
    :root {
      --green: #244334;
      --green2: #315744;
      --beige: #f5efe3;
      --gold: #c8a65a;
      --brown: #3b3026;
      --white: #ffffff;
      --shadow: 0 18px 45px rgba(0,0,0,0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
      color: var(--brown);
      background: var(--beige);
      line-height: 1.8;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      min-height: 100svh;
      padding: 22px 18px 46px;
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(rgba(36,67,52,0.82), rgba(36,67,52,0.82)),
        url("https://uematsutotonoi.github.io/totonoi-may-lp/images/hero.jpg") center/cover no-repeat;
    }

    .header {
      width: min(100%, 920px);
      margin: 0 auto 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
    }

    .logo {
      color: #fff;
      font-size: 13px;
      letter-spacing: 0.18em;
      font-weight: 800;
      line-height: 1.2;
      text-shadow: 0 2px 12px rgba(0,0,0,0.35);
    }

    .badge {
      border: 1px solid rgba(255,255,255,0.72);
      border-radius: 999px;
      padding: 8px 13px;
      font-size: 12px;
      font-weight: 800;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
    }

    .thanks-wrap {
      flex: 1;
      display: grid;
      place-items: center;
      width: min(100%, 920px);
      margin: 0 auto;
    }

    .thanks-box {
      width: min(100%, 640px);
      background: rgba(255,255,255,0.96);
      border-radius: 30px;
      padding: 38px 28px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .check {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #d9ba64, #b98b2f);
      color: #fff;
      font-size: 34px;
      font-weight: 900;
      box-shadow: 0 12px 24px rgba(0,0,0,0.16);
    }

    .label {
      display: inline-flex;
      background: #fff1c9;
      color: var(--green);
      border-radius: 999px;
      padding: 7px 13px;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      color: var(--green);
      font-size: clamp(26px, 6vw, 40px);
      line-height: 1.32;
      letter-spacing: 0.02em;
    }

    .lead {
      margin: 18px auto 0;
      max-width: 520px;
      font-size: 15px;
      color: #5d5144;
    }

    .notice {
      margin: 26px auto 0;
      max-width: 520px;
      background: #f7f1e6;
      border: 1px solid #eadfcf;
      border-left: 5px solid var(--gold);
      border-radius: 18px;
      padding: 18px;
      text-align: left;
      font-size: 14px;
      color: #574837;
      font-weight: 700;
    }

    .notice-title {
      color: var(--green);
      font-size: 15px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .next-box {
      margin: 24px auto 0;
      max-width: 520px;
      background: #fff8e8;
      border-radius: 18px;
      padding: 18px;
      font-size: 14px;
      color: #5b4a35;
    }

    .next-box strong {
      color: var(--green);
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 28px auto 0;
      max-width: 520px;
    }

    .btn {
      min-height: 52px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      font-size: 14px;
      font-weight: 900;
    }

    .btn-main {
      background: linear-gradient(135deg, #d9ba64, #b98b2f);
      color: #fff;
      box-shadow: 0 12px 24px rgba(0,0,0,0.16);
    }

    .btn-sub {
      background: #fff;
      color: var(--green);
      border: 1px solid #d8cbb8;
    }

    .small {
      margin: 18px auto 0;
      max-width: 520px;
      color: #7a6b5c;
      font-size: 12px;
    }

    @media (max-width: 560px) {
      .page {
        padding: 18px 14px 34px;
      }

      .header {
        margin-bottom: 24px;
      }

      .logo {
        font-size: 11px;
        letter-spacing: 0.12em;
      }

      .badge {
        font-size: 11px;
        padding: 7px 10px;
      }

      .thanks-box {
        border-radius: 24px;
        padding: 30px 20px;
      }

      .buttons {
        grid-template-columns: 1fr;
      }

      .check {
        width: 64px;
        height: 64px;
        font-size: 30px;
      }
    }
  </style>
</head>
<body>

  <div class="page">
    <header class="header">
      <div class="logo">TOTONOI<br>FUJI YAMANAKAKO</div>
      <div class="badge">5月限定プラン</div>
    </header>

    <main class="thanks-wrap">
      <section class="thanks-box">
        <div class="check">✓</div>

        <div class="label">送信完了</div>

        <h1>
          予約リクエストを<br>
          受け付けました
        </h1>

        <p class="lead">
          この度は、グランピングヴィレッジTOTONOI富士山中湖の
          5月限定プランにリクエストいただきありがとうございます。
        </p>

        <div class="notice">
          <div class="notice-title">ご予約について</div>
          この時点では、まだ予約確定ではありません。<br>
          通常予約も同時に承っているため、空室状況を確認後、担当者より改めてご連絡いたします。
        </div>

        <div class="next-box">
          <strong>次の流れ</strong><br>
          送信内容と空室状況を確認後、担当者よりメール、InstgramDMにてご連絡いたします。
        </div>

        <div class="buttons">
          <a href="index.html" class="btn btn-main">LPページに戻る</a>
          <a href="request.html" class="btn btn-sub">内容を再送信する</a>
        </div>

        <p class="small">
          ※ご入力内容に誤りがあった場合は、再度フォームより送信してください。
        </p>
      </section>
    </main>
  </div>

</body>
</html>
